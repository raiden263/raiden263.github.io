<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理发店预约小程序 - Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f0eb;
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
        }
        .app-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 24px 20px 30px;
            text-align: center;
            border-radius: 0 0 24px 24px;
        }
        .app-header h1 { font-size: 20px; letter-spacing: 2px; margin-bottom: 4px; }
        .app-header .sub { font-size: 12px; color: #8090b0; }
        .shop-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            margin: -16px 16px 0;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .shop-avatar {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .shop-name { font-weight: 700; font-size: 15px; color: #1a1a2e; }
        .shop-addr { font-size: 12px; color: #888; margin-top: 2px; }
        .shop-rating { color: #f39c12; font-size: 12px; margin-top: 2px; }

        .section-title {
            padding: 24px 20px 12px;
            font-size: 15px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .barbers {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            overflow-x: auto;
        }
        .barber-card {
            flex-shrink: 0;
            width: 120px;
            background: white;
            border-radius: 14px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .barber-card.selected { border-color: #1a1a2e; }
        .barber-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .barber-card h4 { font-size: 13px; color: #1a1a2e; }
        .barber-card .level { font-size: 11px; color: #888; margin: 2px 0; }
        .barber-card .price { font-size: 14px; font-weight: 700; color: #f5576c; }

        .dates {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            overflow-x: auto;
        }
        .date-item {
            flex-shrink: 0;
            width: 56px; height: 70px;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .date-item.selected { background: #1a1a2e; color: white; border-color: #1a1a2e; }
        .date-item .day { font-size: 11px; color: inherit; opacity: 0.7; }
        .date-item .num { font-size: 20px; font-weight: 700; color: inherit; }

        .slots {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px;
        }
        .slot {
            padding: 10px 18px;
            background: white;
            border-radius: 22px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .slot.selected { background: #1a1a2e; color: white; border-color: #1a1a2e; }
        .slot.unavailable { background: #f0f0f0; color: #ccc; cursor: not-allowed; }

        .btn-book {
            display: block;
            margin: 30px 20px;
            padding: 16px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            width: calc(100% - 40px);
            transition: transform 0.2s;
        }
        .btn-book:hover { transform: scale(1.02); }
        .btn-book:active { transform: scale(0.98); }
        .back-link { text-align: center; padding: 20px; }
        .back-link a { color: #888; text-decoration: none; font-size: 12px; }

        .toast {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            color: white;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 999;
            display: none;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>💈 首席造型</h1>
        <div class="sub">在线预约 · 到店服务</div>
    </div>

    <div class="shop-info">
        <div class="shop-avatar">💈</div>
        <div>
            <div class="shop-name">首席造型 · 大学城店</div>
            <div class="shop-addr">📍 大学城商业街2楼 208号</div>
            <div class="shop-rating">⭐ 4.9 (326条评价)</div>
        </div>
    </div>

    <div class="section-title">👨‍🎨 选择发型师</div>
    <div class="barbers">
        <div class="barber-card selected" onclick="selectBarber(this)">
            <div class="barber-avatar" style="background:#fef3c7;">🧑‍🦱</div>
            <h4>Tony 老师</h4>
            <div class="level">高级设计师</div>
            <div class="price">¥88</div>
        </div>
        <div class="barber-card" onclick="selectBarber(this)">
            <div class="barber-avatar" style="background:#e0e7ff;">👨‍🦰</div>
            <h4>Kevin 总监</h4>
            <div class="level">创意总监</div>
            <div class="price">¥158</div>
        </div>
        <div class="barber-card" onclick="selectBarber(this)">
            <div class="barber-avatar" style="background:#fce7f3;">👩‍🦳</div>
            <h4>Lily 老师</h4>
            <div class="level">资深设计师</div>
            <div class="price">¥108</div>
        </div>
    </div>

    <div class="section-title">📅 选择日期</div>
    <div class="dates" id="dates"></div>

    <div class="section-title">⏰ 选择时间</div>
    <div class="slots" id="slots"></div>

    <button class="btn-book" onclick="book()">✨ 立即预约</button>
    <div class="back-link"><a href="../index.html">← 返回主页</a></div>
    <div class="toast" id="toast"></div>

    <script>
        // 生成日期
        const datesDiv = document.getElementById('dates');
        const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
        let selectedDate = 0;
        for (let i = 0; i < 7; i++) {
            const d = new Date();
            d.setDate(d.getDate() + i);
            const div = document.createElement('div');
            div.className = 'date-item' + (i === 0 ? ' selected' : '');
            div.innerHTML = '<span class="day">' + (i === 0 ? '今天' : weekNames[d.getDay()]) + '</span><span class="num">' + d.getDate() + '</span>';
            div.onclick = function() {
                document.querySelectorAll('.date-item').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
                selectedDate = i;
                genSlots();
            };
            datesDiv.appendChild(div);
        }

        // 生成时间段
        function genSlots() {
            const slotsDiv = document.getElementById('slots');
            slotsDiv.innerHTML = '';
            const allSlots = ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30'];
            allSlots.forEach((t, i) => {
                const div = document.createElement('div');
                const unavailable = i < 2 + selectedDate;
                div.className = 'slot' + (unavailable ? ' unavailable' : '');
                div.textContent = t;
                if (!unavailable) {
                    div.onclick = function() {
                        document.querySelectorAll('.slot:not(.unavailable)').forEach(el => el.classList.remove('selected'));
                        this.classList.add('selected');
                    };
                }
                slotsDiv.appendChild(div);
            });
        }
        genSlots();

        function selectBarber(el) {
            document.querySelectorAll('.barber-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function book() {
            const toast = document.getElementById('toast');
            toast.textContent = '✅ 预约成功！到店出示手机号即可';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }
    </script>
</body>
</html>
