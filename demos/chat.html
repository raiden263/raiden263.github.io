<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天助手 - Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 92vh;
            background: #111827;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f1322;
        }
        .chat-header .avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .chat-header .info { flex: 1; }
        .chat-header .name { color: white; font-weight: 600; font-size: 14px; }
        .chat-header .status { color: #6b7280; font-size: 11px; }
        .chat-header .mode-badge {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 10px;
            letter-spacing: 1px;
        }
        .mode-badge.demo { background: rgba(255,152,0,0.15); color: #ff9800; }
        .mode-badge.live { background: rgba(0,230,118,0.15); color: #00e676; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease-out;
            max-width: 90%;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.ai { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message .avatar-icon {
            width: 30px; height: 30px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .message.ai .avatar-icon { background: rgba(102, 126, 234, 0.2); }
        .message.user .avatar-icon { background: rgba(118, 75, 162, 0.3); }
        .message .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.65;
            word-break: break-word;
        }
        .message.ai .bubble {
            background: rgba(255,255,255,0.06);
            color: #d1d5db;
            border-bottom-left-radius: 4px;
        }
        .message.user .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message .bubble pre {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 12px;
            font-family: 'Fira Code', 'Consolas', monospace;
        }
        .message .bubble code {
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 12px;
        }
        .message .bubble p { margin: 4px 0; }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #6b7280;
            animation: blink 1.4s infinite both;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
        .chat-input-area {
            padding: 14px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 10px;
            background: #0f1322;
        }
        .chat-input-area textarea {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
            max-height: 100px;
            transition: border-color 0.3s;
        }
        .chat-input-area textarea:focus { border-color: #667eea; }
        .chat-input-area textarea::placeholder { color: #506080; }
        .send-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .bottom-bar {
            padding: 6px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bottom-bar a { color: #506080; text-decoration: none; font-size: 11px; }
        .bottom-bar a:hover { color: #667eea; }
        .bottom-bar .settings-btn {
            background: none; border: none;
            color: #506080; cursor: pointer; font-size: 13px;
            padding: 4px 8px;
        }
        .settings-btn:hover { color: #667eea; }

        /* 设置面板 */
        .settings-panel {
            display: none;
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            background: #0d1120;
        }
        .settings-panel.show { display: block; }
        .settings-panel label {
            display: block;
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .settings-panel input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            margin-bottom: 10px;
            outline: none;
        }
        .settings-panel input:focus { border-color: #667eea; }
        .settings-row {
            display: flex;
            gap: 10px;
            align-items: end;
        }
        .settings-row button {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: #b8b8d0;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .settings-row button:hover { border-color: #667eea; color: #667eea; }
        .settings-row button.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">🤖</div>
            <div class="info">
                <div class="name">AI 助手</div>
                <div class="status" id="statusText">演示模式 · 离线可用</div>
            </div>
            <span class="mode-badge demo" id="modeBadge">DEMO</span>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input-area">
            <textarea id="input" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
        </div>
        <div class="settings-panel" id="settingsPanel">
            <label>API Key</label>
            <input type="password" id="apiKey" placeholder="输入你的 Anthropic API Key (sk-ant-...)">
            <label>API 地址 (可选，留空用官方)</label>
            <input type="text" id="apiBase" placeholder="https://api.anthropic.com">
            <div class="settings-row">
                <button class="primary" onclick="saveSettings()">💾 保存并启用</button>
                <button onclick="toggleDemo()">🔄 切换演示模式</button>
                <button onclick="clearChat()">🗑 清空对话</button>
            </div>
        </div>
        <div class="bottom-bar">
            <a href="../index.html">← 返回主页</a>
            <button class="settings-btn" onclick="toggleSettings()">⚙️ 设置</button>
        </div>
    </div>

    <script>
        // ===== 状态 =====
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        let isGenerating = false;
        let useLiveApi = false;
        let conversationHistory = [];

        // ===== 初始化 =====
        function init() {
            // 加载设置
            const savedKey = localStorage.getItem('ai_chat_api_key');
            const savedBase = localStorage.getItem('ai_chat_api_base');
            const savedMode = localStorage.getItem('ai_chat_mode');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            if (savedBase) document.getElementById('apiBase').value = savedBase;
            if (savedMode === 'live' && savedKey) {
                useLiveApi = true;
                updateModeUI();
            }

            // 欢迎消息
            addMessage('ai', `你好！我是 AI 助手 👋\n\n当前在**演示模式**下运行，可以模拟对话效果。\n\n想接入真正的 AI？点击右下角 ⚙️ **设置**，填入你的 API Key 即可切换为在线模式。\n\n试试问我：\n- "写一个 Python 快速排序"\n- "解释什么叫 Docker"\n- "帮我取个好听的品牌名"`);
        }

        function updateModeUI() {
            const badge = document.getElementById('modeBadge');
            const status = document.getElementById('statusText');
            if (useLiveApi) {
                badge.textContent = 'LIVE';
                badge.className = 'mode-badge live';
                status.textContent = '在线模式 · Claude API';
            } else {
                badge.textContent = 'DEMO';
                badge.className = 'mode-badge demo';
                status.textContent = '演示模式 · 离线可用';
            }
        }

        // ===== 设置面板 =====
        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('show');
        }

        function saveSettings() {
            const key = document.getElementById('apiKey').value.trim();
            const base = document.getElementById('apiBase').value.trim();
            if (!key) { alert('请先输入 API Key'); return; }
            localStorage.setItem('ai_chat_api_key', key);
            localStorage.setItem('ai_chat_api_base', base || 'https://api.anthropic.com');
            localStorage.setItem('ai_chat_mode', 'live');
            useLiveApi = true;
            updateModeUI();
            document.getElementById('settingsPanel').classList.remove('show');
            addMessage('ai', '✅ 已切换到**在线模式**！现在我是真正的 AI 了，随便问我什么吧。');
        }

        function toggleDemo() {
            useLiveApi = !useLiveApi;
            localStorage.setItem('ai_chat_mode', useLiveApi ? 'live' : 'demo');
            updateModeUI();
            const msg = useLiveApi ? '✅ 已切换到**在线模式**' : '🔄 已切换到**演示模式**';
            addMessage('ai', msg);
        }

        function clearChat() {
            messagesDiv.innerHTML = '';
            conversationHistory = [];
            init();
        }

        // ===== 发送消息 =====
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
            // 自动调整高度
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 100) + 'px';
        }

        async function send() {
            const text = input.value.trim();
            if (!text || isGenerating) return;
            input.value = '';
            input.style.height = 'auto';
            isGenerating = true;
            sendBtn.disabled = true;

            addMessage('user', text);

            if (useLiveApi) {
                await sendLive(text);
            } else {
                await sendDemo(text);
            }

            isGenerating = false;
            sendBtn.disabled = false;
            input.focus();
        }

        // ===== 演示模式 =====
        async function sendDemo(text) {
            const msgDiv = addMessage('ai', '');
            const bubble = msgDiv.querySelector('.bubble');
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            scrollBottom();

            const reply = generateDemoReply(text);
            await streamText(bubble, reply);
        }

        function generateDemoReply(text) {
            const t = text.toLowerCase();

            if (t.includes('排序') || t.includes('sort')) {
                return '```python\ndef quick_sort(arr):\n    if len(arr) <= 1:\n        return arr\n    pivot = arr[len(arr) // 2]\n    left = [x for x in arr if x < pivot]\n    middle = [x for x in arr if x == pivot]\n    right = [x for x in arr if x > pivot]\n    return quick_sort(left) + middle + quick_sort(right)\n\n# 测试\nprint(quick_sort([3, 6, 8, 10, 1, 2, 1]))\n# 输出: [1, 1, 2, 3, 6, 8, 10]\n```\n\n这是快速排序的 Python 实现。核心思想是**分治法**：\n1. 选一个基准值（pivot）\n2. 把数组分成比它小的和比它大的两部分\n3. 递归排序两部分\n\n时间复杂度 O(n log n)，实际工程中非常常用。';
            }

            if (t.includes('docker')) {
                return '**Docker** 是一个容器化平台，简单说就是把应用和它的依赖打包成一个"集装箱"，在任何机器上都能跑。\n\n### 核心概念\n- **镜像（Image）**：应用的模板，类似于安装包\n- **容器（Container）**：镜像的运行实例，隔离的轻量级环境\n- **Dockerfile**：定义怎么构建镜像的脚本\n\n### 为什么火？\n- 开发环境 = 生产环境，不会出现"我电脑上能跑"\n- 一台服务器能跑几十个容器，资源利用率高\n- 快速部署，一条命令启动全套服务\n\n```dockerfile\n# 一个简单的 Node.js Dockerfile\nFROM node:20\nWORKDIR /app\nCOPY package*.json ./\nRUN npm install\nCOPY . .\nCMD ["node", "server.js"]\n```';
            }

            if (t.includes('品牌名') || t.includes('取名') || t.includes('起名')) {
                return '帮你想几个方向的品牌名：\n\n### 🌐 科技 / SaaS\n- **NexusIO** — 连接万物的意思\n- **MindGrid** — 思维网格，适合 AI 产品\n- **FluxWave** — 流式浪潮，适合实时数据类\n\n### 🎨 创意 / 设计\n- **灵感胶囊** — 适合笔记/知识管理\n- **白板鲸** — 适合协作工具，好记\n- **造物云** — 适合低代码/搭建类\n\n### 🛒 电商 / 消费\n- **淘海** — 简洁好记\n- **轻选** — 适合精选电商\n- **指尖集** — 适合手作/小众品牌\n\n你具体做什么方向？我可以更有针对性地想。';
            }

            if (t.includes('你好') || t.includes('hello') || t.includes('hi')) {
                return '你好呀！👋\n\n有什么想聊的？编程、技术、产品、起名、写代码……都可以问我。我目前在演示模式下运行，点击 ⚙️ 设置可以接入真正的 AI。';
            }

            if (t.includes('react') || t.includes('vue') || t.includes('前端')) {
                return '前端框架选择建议：\n\n### React\n- 生态最大，第三方库最多\n- 适合大型复杂应用\n- 学习曲线：JSX、Hooks、状态管理\n\n### Vue\n- 上手最简单，中文文档好\n- 单文件组件（SFC）直观\n- 适合中小型项目快速开发\n\n### 我的建议\n- 学一个就够，先把 JS 基础打牢\n- React 岗位多，Vue 写起来爽\n- 重点是理解**响应式**和**组件化**思想，框架只是工具';
            }

            if (t.includes('代码') || t.includes('写一个') || t.includes('编程')) {
                return '写代码我在行！告诉我具体要什么：\n\n- **什么语言**？Python / JavaScript / Go / ...\n- **什么功能**？爬虫 / API / 工具脚本 / 页面 / ...\n- **什么场景**？学习 / 工作 / 项目 / 面试 / ...\n\n举个例子，你说"帮我写一个天气查询脚本"，我就能给你完整的可运行代码。';
            }

            // 默认回复
            const defaults = [
                '这是个好问题！\n\n关于"' + text.slice(0, 20) + '"，让我想想……\n\n这方面的内容涉及多个层面。如果你能告诉我更具体的需求，我可以给出更精准的回答。\n\n目前我在演示模式下运行，回复来自本地规则匹配。想获得真正的 AI 对话体验，点击右下角 ⚙️ 设置，填入 API Key 即可。',
                '有趣的问题！\n\n虽然我现在是演示模式，但也能聊不少东西。试试问我：\n- 编程相关（算法、框架、代码示例）\n- 技术概念（什么是 REST、Docker、微服务）\n- 创意类（取名、产品思路、设计建议）\n\n或者点 ⚙️ 设置接入真正的 AI～',
                '收到！说详细一点？比如：\n- 你想做什么？\n- 遇到什么问题了？\n- 需要什么类型的帮助？\n\n信息越多，我能帮得越具体 😊',
            ];
            return defaults[Math.floor(Math.random() * defaults.length)];
        }

        // ===== 在线模式 =====
        async function sendLive(text) {
            const msgDiv = addMessage('ai', '');
            const bubble = msgDiv.querySelector('.bubble');
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            scrollBottom();

            const apiKey = localStorage.getItem('ai_chat_api_key');
            const apiBase = (localStorage.getItem('ai_chat_api_base') || 'https://api.anthropic.com').replace(/\/$/, '');

            conversationHistory.push({ role: 'user', content: text });

            try {
                const response = await fetch(apiBase + '/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-6',
                        max_tokens: 1024,
                        stream: true,
                        messages: [
                            { role: 'user', content: '你是一个友好的AI助手，回答简洁有用。用户问：' + conversationHistory.slice(-3).map(m => m.content).join(' | ') }
                        ]
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    let errMsg = '请求失败: ' + response.status;
                    try {
                        const errJson = JSON.parse(errText);
                        errMsg = errJson.error?.message || errMsg;
                    } catch(e) {}
                    throw new Error(errMsg);
                }

                bubble.innerHTML = '';
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const json = JSON.parse(data);
                            const content = json.delta?.text || json.content_block?.delta?.text || '';
                            if (content) {
                                fullText += content;
                                bubble.innerHTML = renderMarkdown(fullText);
                                scrollBottom();
                            }
                        } catch(e) {}
                    }
                }

                if (!fullText) {
                    bubble.innerHTML = '(收到空回复，请重试)';
                }

                conversationHistory.push({ role: 'assistant', content: fullText });

            } catch(e) {
                bubble.innerHTML = '❌ **出错了**\n\n' + e.message + '\n\n可能的原因：\n- API Key 无效或过期\n- 网络不通（国内可能需要代理）\n- CORS 限制（浏览器直接调 API 可能被拦截）\n\n👉 建议：切换到演示模式，或检查网络和 API Key。';
                console.error('Chat error:', e);
            }
        }

        // ===== 工具函数 =====
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML =
                '<div class="avatar-icon">' + (role === 'ai' ? '🤖' : '👤') + '</div>' +
                '<div class="bubble">' + (content ? renderMarkdown(content) : '') + '</div>';
            messagesDiv.appendChild(div);
            scrollBottom();
            return div;
        }

        function renderMarkdown(text) {
            // 代码块
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            // 行内代码
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            // 粗体
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // 斜体
            text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            // 链接
            text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#667eea;">$1</a>');
            // 换行
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        async function streamText(element, text) {
            element.innerHTML = '';
            const chars = [...text];
            for (let i = 0; i < chars.length; i++) {
                element.innerHTML = renderMarkdown(chars.slice(0, i + 1).join(''));
                scrollBottom();
                await sleep(15 + Math.random() * 20);
            }
        }

        function scrollBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        init();
    </script>
</body>
</html>
